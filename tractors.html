      <p>Explore tractors available through Domaki Motors.</p>

  <section class="section">

      <div class="finder-panel glass" style="margin-bottom:40px;">
        <div class="finder-grid">
          <label class="field">
            <span>Search</span>
            <input type="text" id="inventorySearch" placeholder="Search by model, brand or horsepower...">

              <option value="0-2500000">Under KES 2.5M</option>
              <option value="2500000-3000000">KES 2.5M – 3.0M</option>

        </div>

        <div style="margin-top:18px;display:flex;gap:18px;flex-wrap:wrap;">

        <div style="margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;">
          <label class="compare-check"><input type="checkbox" data-filter="drive" value="2WD"> 2WD</label>
          <label class="compare-check"><input type="checkbox" data-filter="drive" value="4WD"> 4WD</label>
          <label class="compare-check"><input type="checkbox" data-filter="condition" value="New"> New</label>
          <label class="compare-check"><input type="checkbox" data-filter="condition" value="Used"> Used</label>
          <label class="compare-check"><input type="checkbox" data-filter="transmission" value="Manual"> Manual</label>
