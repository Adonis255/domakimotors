<body data-page="faq">

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-inner">
    <span class="loader-brand">DOMAKI</span>
    <span class="loader-brand is-alt">MOTORS</span>
    <span class="loader-bar"><i></i></span>
  </div>
</div>

<header class="site-header" id="site-header"></header>

<main>

  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">Support</p>
      <h1>FREQUENTLY ASKED QUESTIONS</h1>
      <p>Answers to common questions about our tractors, machinery and services.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="faq-list" id="faqList"></div>
    </div>
  </section>

</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/config.js" defer></script>
<script src="js/tractors.js" defer></script>
<script src="js/main.js" defer></script>
<script src="js/animations.js" defer></script>
<script>
  const faqs = [
    ["What types of tractors do you sell?", "We offer utility tractors, farm tractors and agricultural tractors suited to a range of farm operations."],
    ["Do you sell new and used tractors?", "Our inventory includes both new and used options. Availability varies — contact us for current stock."],
    ["Can I request a tractor quote?", "Yes. Use the quote form on our contact page or WhatsApp us with the model you are interested in."],
    ["Do you offer financing?", "Financing availability depends on applicable financing partners and customer eligibility. Contact Domaki Motors for current options."],
    ["Can I compare tractors?", "Yes. On the tractors page you can select up to three tractors and compare their specifications side by side."],
    ["Do you sell agricultural implements?", "Yes. We offer ploughs, harrows, trailers, planters, cultivators, slashers and more."],
    ["Where is Domaki Motors located?", "We are based in Eldoret, Uasin Gishu County, Kenya."],
    ["Can I contact you through WhatsApp?", "Yes. Use the floating WhatsApp button or click any WhatsApp link on the site."],
    ["Can I request a specific tractor?", "Yes. If you are looking for a particular model, contact us and we will help source it."],
    ["Do you offer after-sales support?", "We provide support before and after purchase. Contact us for details on the assistance available."]
  ];

  document.addEventListener("DOMContentLoaded", function () {
    const list = document.getElementById("faqList");
    if (!list) return;
    list.innerHTML = faqs.map(function (item) {
      return '<div class="faq-item reveal">' +
        '<button class="faq-q" aria-expanded="false">' + item[0] + '</button>' +
        '<div class="faq-a"><p>' + item[1] + '</p></div>' +
      '</div>';
    }).join("");

    list.querySelectorAll(".faq-q").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const item = btn.parentElement;
        const open = item.classList.toggle("open");
        btn.setAttribute("aria-expanded", open);
      });
    });

    if (window.revealObserve) window.revealObserve();
  });
</script>
</body>
